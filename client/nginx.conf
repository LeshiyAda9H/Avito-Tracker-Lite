server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Проксирование запросов к API на сервер
    location /api/ {
        proxy_pass http://server:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;  # Увеличиваем таймаут подключения
        proxy_read_timeout 30s;     # Увеличиваем таймаут чтения
        proxy_send_timeout 30s;     # Увеличиваем таймаут отправки
        proxy_buffer_size 128k;     # Увеличиваем размер буфера
        proxy_buffers 4 256k;       # Увеличиваем количество буферов
        proxy_busy_buffers_size 256k;
    }

    # Перенаправляем все остальные запросы на index.html для поддержки React Router
    location / {
        try_files $uri /index.html;
    }

    # Настройка кэширования статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Логирование ошибок
    error_log /var/log/nginx/error.log warn;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}